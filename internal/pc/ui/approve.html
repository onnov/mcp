<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подтверждение запуска</title><style>:root{color-scheme:light dark}body{font:14px system-ui;margin:0;padding:16px}h1{font-size:17px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#8881;padding:12px;border-radius:8px;max-height:300px;overflow:auto}button{font:inherit;padding:9px 16px;margin-right:8px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{margin:12px 0}#target{overflow-wrap:anywhere}.error{color:#e44}</style>
<h1>Запустить команду на ПК?</h1><p id="target"></p><pre id="command"></pre><p id="policy"></p><button id="approve" disabled>Разрешить запуск</button><button id="cancel" disabled>Отменить</button><div id="status" role="status" aria-live="polite">Ожидание параметров…</div><pre id="output" hidden></pre>
<script>/*BRIDGE*/</script><script>
(async()=>{'use strict';const $=id=>document.getElementById(id);let job=null,nonce='',ready=false,initial=null,pollTimer=null,cursor=0,log=[];
 const status=(t,error=false)=>{$('status').textContent=t;$('status').classList.toggle('error',error);PC.resize()};
 function receive(r){if(!r?.structuredContent?.id)return;job=r.structuredContent;nonce=r._meta?.approval_nonce||window.openai?.toolResponseMetadata?.approval_nonce||nonce;const q=job.request;$('target').textContent='Каталог: '+q.directory+' · Ветка: '+(q.branch||'без Git')+' · cwd: '+q.cwd;$('command').textContent=JSON.stringify(q.args,null,2);$('policy').textContent='Назначение: '+q.purpose+' · сеть: '+(q.network?'разрешена':'выключена')+' · лимит: '+q.seconds+' сек.'+(q.credential?' · будет передан отдельный GitHub-токен':'');$('approve').disabled=!ready||!nonce||job.status!=='awaiting_approval';$('cancel').disabled=!ready;if(!nonce&&ready)status('Клиент не передал приватные данные подтверждения. Запуск заблокирован; обновите приложение.',true);else status('Команда ещё не запущена.');PC.resize()}
 async function poll(){if(!job)return;try{const v=await PC.tool('pc_job_status',{id:job.id,after:cursor});cursor=v.output.cursor;for(const l of [...v.output.head,...v.output.tail])log.push(l.stream+': '+l.text+(l.truncated?' [длинная строка разделена]':''));if(log.length>110)log=log.slice(-110);$('output').hidden=false;$('output').textContent=log.join('\n');status(v.status+(v.error?' · '+v.error:'')+(v.output.message?' · '+v.output.message:'')+(v.output.omitted?' · пропущено записей: '+v.output.omitted:''));await PC.context({pcJob:{id:v.id,status:v.status}},'PC command job '+v.id+' is '+v.status+'. Poll pc_job_status for the result.');if(v.status==='running')pollTimer=setTimeout(poll,2000);else $('cancel').disabled=true}catch(e){status(e.message,true)}}
 $('approve').onclick=async()=>{if(!job||!nonce)return;$('approve').disabled=true;try{const v=await PC.tool('pc_approve_run',{id:job.id,approval_nonce:nonce});nonce='';job=v;status('Запущено: '+v.id);await PC.context({pcJob:{id:v.id,status:v.status}},'User confirmed PC command. Job ID: '+v.id+'. Poll pc_job_status; do not start a duplicate job.');poll()}catch(e){status(e.message,true);$('approve').disabled=!nonce}};
 $('cancel').onclick=async()=>{if(!job)return;clearTimeout(pollTimer);$('approve').disabled=true;try{await PC.tool('pc_cancel_job',{id:job.id});poll()}catch(e){status(e.message,true)}};
 PC.onResult(r=>{initial=r;if(ready)receive(r)});try{await PC.ready();ready=true;if(initial)receive(initial)}catch(e){status(e.message,true)};
})();
</script></html>
