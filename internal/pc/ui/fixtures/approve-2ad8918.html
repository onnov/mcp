<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подтверждение запуска</title><style>:root{color-scheme:light dark}body{font:14px system-ui;margin:0;padding:16px}h1{font-size:17px;margin:0 0 12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#8881;padding:12px;border-radius:8px;max-height:420px;overflow:auto}button{font:inherit;padding:9px 16px;margin:0 8px 8px 0;cursor:pointer}button:disabled{opacity:.5;cursor:default}.actions{margin-top:12px}#status{margin:12px 0;font-weight:600}#target,#policy,#metrics{overflow-wrap:anywhere}#metrics{font-size:12px;opacity:.85;margin:8px 0}.error{color:#e44}.ok{color:#2a8}.muted{opacity:.7}</style>
<h1>Запуск команды на ПК</h1><p id="target"></p><pre id="command"></pre><p id="policy"></p><div class="actions"><button id="approve" disabled>Разрешить запуск</button><button id="cancel" disabled>Остановить эту команду</button><button id="stop-all" hidden disabled>Остановить все команды</button></div><div id="status" role="status" aria-live="polite">Ожидание параметров…</div><div id="metrics" class="muted"></div><pre id="output" hidden></pre>
<script>/*BRIDGE*/</script><script>
(async()=>{'use strict';const $=id=>document.getElementById(id);let job=null,nonce='',ready=false,initial=null,pollTimer=null,statusCursor=0,outputCursor=0,log=[],busy=false,evicted=0,activeJobID='',approvalConsumed=false;
 const terminal=new Set(['succeeded','failed','cancelled','timed_out']);
 const labels={awaiting_approval:'Команда ещё не запущена',queued:'Ожидайте. Команда поставлена в очередь…',running:'Ожидайте. Команда выполняется…',succeeded:'Команда выполнена успешно',failed:'Команда завершилась с ошибкой',cancelled:'Команда отменена',timed_out:'Превышен лимит времени'};
 const status=(t,error=false,ok=false)=>{$('status').textContent=t;$('status').classList.toggle('error',error);$('status').classList.toggle('ok',ok);PC.resize()};
 const humanBytes=n=>{if(!n)return'0 Б';if(n<1024)return n+' Б';if(n<1024*1024)return(n/1024).toFixed(1)+' КиБ';return(n/1024/1024).toFixed(1)+' МиБ'};
 const elapsed=v=>{if(!v?.started||v.started.startsWith('0001-'))return'';const end=v.finished&&!v.finished.startsWith('0001-')?Date.parse(v.finished):Date.now(),start=Date.parse(v.started);if(!Number.isFinite(start)||!Number.isFinite(end))return'';const ms=Math.max(0,end-start);return ms<1000?ms+' мс':(ms/1000).toFixed(2)+' с'};
 const isRunning=()=>!!job&&['running','queued'].includes(job.status);
 const renderButtons=()=>{if(!job)return;const waiting=job.status==='awaiting_approval';const approvalRelevant=approvalConsumed||waiting||!!nonce;$('approve').hidden=!approvalRelevant;$('approve').textContent=approvalConsumed?'Запуск разрешён':'Разрешить запуск';$('approve').disabled=approvalConsumed||busy||!ready||!nonce||!waiting;$('cancel').hidden=false;$('cancel').disabled=busy||!ready||!isRunning();$('stop-all').hidden=!isRunning();$('stop-all').disabled=busy||!ready||!isRunning()};
 const renderMetrics=v=>{const parts=[];if(v.exit_code!==undefined&&v.exit_code!==null)parts.push('exit code: '+v.exit_code);const d=elapsed(v);if(d)parts.push('время: '+d);if(v.output){parts.push('вывод: '+v.output.total_records+' записей / '+humanBytes(v.output.bytes));if(v.output.omitted)parts.push('компактный status пропустил: '+v.output.omitted);if(evicted)parts.push('удалено из retained-лога: '+evicted)}$('metrics').textContent=parts.join(' · ')};
 const appendRecords=records=>{for(const l of records||[]){const mark=l.stream==='stderr'?'stderr':'stdout';log.push(String(l.sequence).padStart(5,'0')+' ['+mark+'] '+l.text+(l.truncated?'  [фрагмент длинной строки]':''))}$('output').hidden=log.length===0;$('output').textContent=log.join('\n')};
 async function drainOutput(){if(!job)return;for(let page=0;page<20;page++){const p=await PC.tool('pc_job_output',{id:job.id,after:outputCursor,limit:200});evicted+=p.evicted||0;if(!p.records?.length)break;appendRecords(p.records);const next=p.cursor||outputCursor;if(next<=outputCursor)break;outputCursor=next;if(p.records.length<200)break}}
 function renderJobState(v){renderButtons();renderMetrics(v);const label=labels[v.status]||v.status;const details=(v.error?' · '+v.error:'')+(evicted?' · часть старого вывода удалена из памяти':'');status(label+(v.id?' · '+v.id:'')+details,v.status==='failed'||v.status==='timed_out',v.status==='succeeded')}
 function receive(r){const incoming=r?.structuredContent;if(!incoming?.id)return;if(!activeJobID)activeJobID=incoming.id;if(incoming.id!==activeJobID)return;const incomingNonce=r._meta?.approval_nonce||window.openai?.toolResponseMetadata?.approval_nonce||'';if(!approvalConsumed&&incomingNonce)nonce=incomingNonce;
  if(approvalConsumed&&incoming.status==='awaiting_approval'){renderButtons();PC.resize();return}
  job=incoming;renderMetrics(job);if(job.status!=='awaiting_approval'){if(job.status==='running'||job.status==='queued')approvalConsumed=approvalConsumed||!!incomingNonce;renderJobState(job);if(isRunning())poll();return}
  renderButtons();if(!nonce&&ready)status('Клиент не передал приватные данные подтверждения. Запуск заблокирован; обновите приложение.',true);else status('Команда ещё не запущена. Нажмите «Разрешить запуск».');PC.resize()}
 async function poll(){if(!job)return;clearTimeout(pollTimer);try{const v=await PC.tool('pc_job_status',{id:job.id,after:statusCursor});job=v;statusCursor=v.output?.cursor||statusCursor;await drainOutput();busy=false;renderJobState(v);await PC.context({pcJob:{id:v.id,status:v.status,exitCode:v.exit_code}},'PC command job '+v.id+' is '+v.status+'. Console output is available in the command card and via pc_job_output.');if(!terminal.has(v.status))pollTimer=setTimeout(poll,1000)}catch(e){busy=false;renderButtons();status('Не удалось обновить состояние: '+e.message,true)}}
 $('approve').onclick=async()=>{if(!job||!nonce||busy||approvalConsumed||job.status!=='awaiting_approval')return;const approvalNonce=nonce;approvalConsumed=true;nonce='';busy=true;renderButtons();status('Ожидайте. Команда выполняется…');try{const v=await PC.tool('pc_approve_run',{id:job.id,approval_nonce:approvalNonce});job=v;busy=false;renderJobState(v);await PC.context({pcJob:{id:v.id,status:v.status}},'User confirmed PC command. Job ID: '+v.id+'. Poll pc_job_status; do not start a duplicate job.');await poll()}catch(e){busy=false;renderButtons();status('Запуск не состоялся: '+e.message+'. Повторный запуск из этой карточки заблокирован.',true)}};
 $('stop-all').onclick=async()=>{if(busy||!isRunning())return;busy=true;renderButtons();status('Запрошена остановка всех команд…');try{await PC.tool('pc_cancel_all_jobs',{});busy=false;renderButtons();await poll()}catch(e){busy=false;renderButtons();status(e.message,true)}};
 $('cancel').onclick=async()=>{if(!job||busy||!isRunning())return;busy=true;clearTimeout(pollTimer);renderButtons();status('Запрошена остановка команды…');try{await PC.tool('pc_cancel_job',{id:job.id});busy=false;renderButtons();await poll()}catch(e){busy=false;renderButtons();status(e.message,true)}};
 PC.onResult(r=>{initial=r;if(ready)receive(r)});try{await PC.ready();ready=true;if(initial)receive(initial)}catch(e){status(e.message,true)};
})();
</script></html>
